<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigilDrive | Driver Drowsiness Detection</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MediaPipe Face Mesh for in-browser landmarks -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --neon-cyan: #00E5FF;
            --warning-amber: #FFC107;
            --critical-red: #FF3D00;
            --electric-blue: #007BFF;
            --alert-orange: #FF8C00;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --grid-line: rgba(0, 229, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Strobing Alert Border (Pulse-to-Alarm) */
        body.critical-mode {
            animation: strobeBorder 0.4s infinite alternate;
        }

        @keyframes strobeBorder {
            0% { box-shadow: inset 0 0 20px rgba(255, 61, 0, 0.2); }
            100% { box-shadow: inset 0 0 100px rgba(255, 61, 0, 0.8); }
        }

        /* Header / Logo */
        header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        /* Eye-shield icon styling */
        .logo-icon {
            position: relative;
            width: 35px;
            height: 35px;
            background: var(--electric-blue);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseShield 2s infinite alternate;
        }
        .logo-icon i { color: var(--alert-orange); font-size: 16px; }

        @keyframes pulseShield {
            0% { filter: drop-shadow(0 0 5px var(--electric-blue)); }
            100% { filter: drop-shadow(0 0 15px var(--electric-blue)); }
        }

        body.critical-mode .logo-icon {
            background: var(--critical-red);
            animation: pulseFast 0.2s infinite alternate;
        }
        @keyframes pulseFast {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .sys-status {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 5px 15px;
            border-radius: 4px;
            background: rgba(0, 229, 255, 0.1);
        }

        /* Main Dashboard Grid */
        .dashboard {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* Vision HUD Panel */
        .vision-panel {
            flex: 2;
            position: relative;
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        video { display: none; }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
        }

        /* HUD Overlays */
        .hud-overlay {
            position: absolute;
            top: 20px; left: 20px;
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-cyan);
            pointer-events: none;
        }
        .hud-overlay p { margin-bottom: 5px; font-size: 14px; }

        .pull-over-alert {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 700;
            color: var(--critical-red);
            text-shadow: 0 0 20px var(--critical-red);
            letter-spacing: 5px;
            opacity: 0;
            pointer-events: none;
        }
        body.critical-mode .pull-over-alert { opacity: 1; animation: flashText 0.5s infinite; }
        @keyframes flashText { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Yawn Wave Animation */
        .yawn-ripple {
            position: absolute;
            top: 60%; left: 50%;
            width: 50px; height: 50px;
            background: transparent;
            border: 4px solid var(--warning-amber);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
        }
        .yawn-active {
            animation: rippleEffect 1s ease-out;
        }
        @keyframes rippleEffect {
            0% { width: 50px; height: 50px; opacity: 1; border-width: 10px; }
            100% { width: 400px; height: 400px; opacity: 0; border-width: 1px; }
        }

        /* Telemetry Panel (Stats & Gauge) */
        .telemetry-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-cyan); border-radius: 12px 0 0 12px;
        }

        .card h3 {
            color: #888;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Metrics */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .metric-label { font-size: 18px; color: #ccc; }
        .metric-val { font-family: 'Share Tech Mono', monospace; font-size: 24px; font-weight: bold; color: var(--neon-cyan); }
        
        /* Progress Bar (Alertness) */
        .progress-bar-bg {
            width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 100%; background: #00E5FF; transition: all 0.3s;
        }

        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--neon-cyan); font-family: 'Share Tech Mono'; }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-power-off"></i></div>
            VigilDrive
        </div>
        <div class="sys-status" id="sysStatus">
            <i class="fa-solid fa-microchip"></i> SYSTEM_ACTIVE // FPS: <span id="fps">0</span>
        </div>
    </header>

    <div class="dashboard">
        
        <!-- Live Camera Feed (HUD) -->
        <div class="vision-panel">
            <div id="loading" class="loader"><i class="fa-solid fa-radar fa-spin"></i> CALIBRATING SENSORS...</div>
            <video class="input_video" autoplay playsinline></video>
            <canvas class="output_canvas"></canvas>
            
            <div class="hud-overlay">
                <p>REC [●]</p>
                <p>EAR (Eye Ratio): <span id="earVal">0.00</span></p>
                <p>MAR (Mouth Ratio): <span id="marVal">0.00</span></p>
            </div>

            <div class="pull-over-alert">PULL OVER</div>
            <div class="yawn-ripple" id="yawnRipple"></div>
        </div>

        <!-- Telemetry Data -->
        <div class="telemetry-panel">
            <div class="card">
                <h3>Driver Metrics</h3>
                <div class="metric-row">
                    <span class="metric-label">Micro-sleeps</span>
                    <span class="metric-val" id="sleepCount">0</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Yawns Detected</span>
                    <span class="metric-val" id="yawnCount">0</span>
                </div>
            </div>

            <div class="card" style="border-left-color: var(--neon-cyan);" id="alertnessCard">
                <h3>Alertness Score</h3>
                <div style="font-size: 48px; font-weight: bold; text-align: center; color: var(--neon-cyan);" id="scoreDisplay">
                    100%
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="scoreBar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        
        // UI Elements
        const earVal = document.getElementById('earVal');
        const marVal = document.getElementById('marVal');
        const sleepCountEl = document.getElementById('sleepCount');
        const yawnCountEl = document.getElementById('yawnCount');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const scoreBar = document.getElementById('scoreBar');
        const yawnRipple = document.getElementById('yawnRipple');
        const alertnessCard = document.getElementById('alertnessCard');

        // Logic Variables
        let alertnessScore = 100;
        let sleepCount = 0;
        let yawnCount = 0;
        let eyeClosedFrames = 0;
        let isYawning = false;
        
        // Thresholds based on NTHU-DDD standards
        const EAR_THRESHOLD = 0.22;
        const MAR_THRESHOLD = 0.50;
        const EYE_CLOSED_FRAMES_TRIGGER = 20; // Approx 2/3 second at 30fps

        // Euclidean Distance Helper
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow((p1.x - p2.x), 2) + Math.pow((p1.y - p2.y), 2));
        }

        // Calculate Eye Aspect Ratio
        function calculateEAR(landmarks, top, bottom, left, right) {
            const hDist = getDistance(landmarks[left], landmarks[right]);
            const vDist = getDistance(landmarks[top], landmarks[bottom]);
            return vDist / hDist;
        }

        // Calculate Mouth Aspect Ratio
        function calculateMAR(landmarks) {
            // Inner lips coordinates
            const hDist = getDistance(landmarks[78], landmarks[308]); // Left to right corner
            const vDist = getDistance(landmarks[13], landmarks[14]);  // Top inner to bottom inner
            return vDist / hDist;
        }

        // Audio Alert Simulation
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playAlarm() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // 800Hz beep
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // Recovery Fade Logic
        function triggerRecovery() {
            document.body.classList.remove('critical-mode');
            alertnessCard.style.borderLeftColor = 'var(--neon-cyan)';
            scoreDisplay.style.color = 'var(--neon-cyan)';
            scoreBar.style.background = 'var(--neon-cyan)';
        }

        // FaceMesh Callback
        function onResults(results) {
            document.getElementById('loading').style.display = 'none';
            
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // 1. Calculate EAR
                // Left Eye (simplified indices: top:159, bottom:145, left:33, right:133)
                const leftEAR = calculateEAR(landmarks, 159, 145, 33, 133);
                // Right Eye (simplified indices: top:386, bottom:374, left:362, right:263)
                const rightEAR = calculateEAR(landmarks, 386, 374, 362, 263);
                
                const avgEAR = (leftEAR + rightEAR) / 2;
                earVal.innerText = avgEAR.toFixed(2);

                // 2. Calculate MAR
                const mar = calculateMAR(landmarks);
                marVal.innerText = mar.toFixed(2);

                // Default Color
                let drawColor = '#00E5FF';

                // --- DROWSINESS LOGIC (EAR) ---
                if (avgEAR < EAR_THRESHOLD) {
                    eyeClosedFrames++;
                    drawColor = '#FFC107'; // Warning Amber
                    
                    if (eyeClosedFrames >= EYE_CLOSED_FRAMES_TRIGGER) {
                        drawColor = '#FF3D00'; // Critical Red
                        document.body.classList.add('critical-mode');
                        playAlarm(); // Audio & Haptic signal representation
                        
                        if (eyeClosedFrames === EYE_CLOSED_FRAMES_TRIGGER) {
                            sleepCount++;
                            sleepCountEl.innerText = sleepCount;
                            alertnessScore = Math.max(0, alertnessScore - 15);
                        }
                    }
                } else {
                    if (eyeClosedFrames >= EYE_CLOSED_FRAMES_TRIGGER) {
                        // Recovery triggered when eyes open
                        triggerRecovery();
                    }
                    eyeClosedFrames = 0; 
                }

                // --- YAWN LOGIC (MAR) ---
                if (mar > MAR_THRESHOLD) {
                    if (!isYawning) {
                        isYawning = true;
                        yawnCount++;
                        yawnCountEl.innerText = yawnCount;
                        alertnessScore = Math.max(0, alertnessScore - 5);
                        
                        // Trigger Yawn Wave Animation
                        yawnRipple.classList.remove('yawn-active');
                        void yawnRipple.offsetWidth; // trigger reflow
                        yawnRipple.classList.add('yawn-active');
                    }
                    drawColor = '#FFC107'; // Amber for yawning
                } else {
                    isYawning = false;
                }

                // Update Alertness Score UI
                scoreDisplay.innerText = alertnessScore + "%";
                scoreBar.style.width = alertnessScore + "%";
                if (alertnessScore < 50) {
                    scoreBar.style.background = '#FF3D00';
                    scoreDisplay.style.color = '#FF3D00';
                    alertnessCard.style.borderLeftColor = '#FF3D00';
                }

                // Draw Facial Mesh Skeleton
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: drawColor, lineWidth: 1, fillOpacity: 0.1});
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: drawColor, lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: drawColor, lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: drawColor, lineWidth: 2});
            }
            canvasCtx.restore();
        }

        // Initialize FaceMesh
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        // FPS Calculation
        let lastFrameTime = 0;
        const fpsDisplay = document.getElementById('fps');

        // Start Camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                const now = performance.now();
                fpsDisplay.innerText = Math.round(1000 / (now - lastFrameTime));
                lastFrameTime = now;
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
